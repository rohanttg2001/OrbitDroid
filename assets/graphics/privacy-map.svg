<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><rect width="1200" height="390" rx="24" fill="#061713"/><g fill="none" stroke="#366a50" stroke-width="2"><path d="M377 208h36m374 0h36"/><path d="M403 201l10 7-10 7M813 201l10 7-10 7"/></g><g font-family="Arial,sans-serif"><text x="44" y="60" fill="#98ffca" font-size="16" letter-spacing="3">PRIVACY AT A GLANCE</text><text x="44" y="105" fill="#ecfff4" font-size="32" font-weight="700">Three places. Different responsibilities.</text><rect x="44" y="145" width="326" height="184" rx="16" fill="#0b2920" stroke="#2e654c"/><text x="66" y="181" fill="#98ffca" font-size="15">01</text><text x="66" y="215" fill="#ecfff4" font-size="23" font-weight="700">On your Mac</text><text x="66" y="249" fill="#adc5b7" font-size="16">Devices, apps, preferences, logs</text><text x="66" y="274" fill="#adc5b7" font-size="16">License checked locally</text><text x="66" y="299" fill="#adc5b7" font-size="16">Raw hardware UUID not saved</text><rect x="438" y="145" width="326" height="184" rx="16" fill="#0b2920" stroke="#2e654c"/><text x="460" y="181" fill="#98ffca" font-size="15">02</text><text x="460" y="215" fill="#ecfff4" font-size="23" font-weight="700">During Android setup</text><text x="460" y="249" fill="#adc5b7" font-size="16">Google repositories and terms</text><text x="460" y="274" fill="#adc5b7" font-size="16">Engine + system image download</text><text x="460" y="299" fill="#adc5b7" font-size="16">Published checksums verified</text><rect x="832" y="145" width="326" height="184" rx="16" fill="#0b2920" stroke="#2e654c"/><text x="854" y="181" fill="#98ffca" font-size="15">03</text><text x="854" y="215" fill="#ecfff4" font-size="23" font-weight="700">Inside Android</text><text x="854" y="249" fill="#adc5b7" font-size="16">Apps, Google Play and accounts</text><text x="854" y="274" fill="#adc5b7" font-size="16">Their own network activity</text><text x="854" y="299" fill="#adc5b7" font-size="16">Their own privacy policies</text><text x="44" y="366" fill="#adc5b7" font-size="15">An email request leaves your Mac only if you choose to send it. No web form collects a license key.</text></g></svg>